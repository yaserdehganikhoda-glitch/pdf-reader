name: smoke
on: [push, workflow_dispatch]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install playwright && playwright install --with-deps chromium
      - run: find . -name index.html -not -path "*/node_modules/*" -not -path "./.git/*" | awk '{print length($0), $0}' | sort -n | head -1 | cut -d' ' -f2- > idx.txt; cat idx.txt
      - run: node tools/wd_test.js "$(cat idx.txt)"
      - run: set -o pipefail; python3 tools/smoke_test.py "$(dirname "$(cat idx.txt)")" | tee smoke-report.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: smoke-report, path: smoke-report.txt }

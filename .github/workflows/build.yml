name: Build APK
on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cache offline downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.offline-cache
            ~/.npm
          key: offline-v2-${{ hashFiles('native/checksums.txt', 'native/inject-native.sh', 'native/fetch-offline.sh', 'native/build-phonemizer.sh', 'native/piperphon_jni.c', 'native/Phonemizer.java', 'native/add-denoise-model.sh', 'native/build-mana-phon.sh', 'native/ManaPhon.kt') }}
          restore-keys: |
            offline-v2-
      - name: Prepare web files
        run: |
          mkdir -p www
          # فایل‌های ریشهٔ مخزن مرجع‌اند؛ اگر www/ نسخهٔ متفاوتی داشت هشدار می‌دهیم و با نسخهٔ ریشه جایگزین می‌کنیم
          if [ -s index.html ]; then
            if [ -s www/index.html ] && ! cmp -s index.html www/index.html; then echo "::warning::www/index.html با index.html ریشه فرق داشت؛ نسخهٔ ریشه جایگزین شد"; fi
            cp -f index.html www/index.html
          fi
          test -s www/index.html
          for f in fa_lexicon.js fa_words.js; do
            if [ -s "$f" ]; then
              if [ -s "www/$f" ] && ! cmp -s "$f" "www/$f"; then echo "::warning::www/$f با نسخهٔ ریشه فرق داشت؛ نسخهٔ ریشه جایگزین شد"; fi
              cp -f "$f" "www/$f"
            fi
          done
          test -s www/fa_lexicon.js || echo "::warning::fa_lexicon.js نه در ریشهٔ مخزن است نه در www؛ واژه‌نامهٔ املایی داخل APK نخواهد بود"
      - name: Verify (TXW، نحو، Golden، رگرسیون) روی فایل ارسالی به APK
        run: |
          test -s tools/verify.sh || { echo "::error::tools/verify.sh در مخزن نیست"; exit 1; }
          sh tools/verify.sh www/index.html
      - name: Guard OCR Worker (شناسهٔ تعریف‌نشده؛ مثل «LX is not defined»)
        run: |
          test -s tools/check-ocr-undef.js || { echo "::error::tools/check-ocr-undef.js در مخزن نیست"; exit 1; }
          npm install --prefix /tmp/chk acorn --no-audit --no-fund
          NODE_PATH=/tmp/chk/node_modules node tools/check-ocr-undef.js www/index.html
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Bundle offline web assets (fonts, pdf.js, OCR)
        run: bash native/fetch-offline.sh www
      - name: Add extra reading fonts (fonts/ from repo, built by fonts-bot)
        run: |
          mkdir -p www/fonts/extra
          if [ -s fonts/fonts-extra.css ] && [ -d fonts/extra ]; then
            cp fonts/fonts-extra.css www/fonts/fonts-extra.css
            cp -r fonts/extra/. www/fonts/extra/
            echo "extra fonts copied: $(ls www/fonts/extra | wc -l) files"
          else
            echo "::warning::fonts/fonts-extra.css یا fonts/extra در مخزن نیست؛ قلم‌های بومی بیشتر داخل APK نخواهد بود"
          fi
      - name: Add INT8 rec model (optional, from quantize-ocr workflow)
        run: |
          f=ocr-int8/arabic_PP-OCRv5_mobile_rec_int8.onnx
          if [ -s "$f" ]; then
            mkdir -p www/ocr/paddle && cp "$f" www/ocr/paddle/
            echo "INT8 rec model added: $(stat -c %s "$f") bytes"
          else
            echo "::notice::ocr-int8/ model not found; OCR runs fp32 only"
          fi
      - name: Add Android platform
        run: npx cap add android
      - name: Inject native Piper (sherpa-onnx 2.x + external phonemizer)
        env:
          SHERPA_VER: "2.0.1"
          PP_VER: "v1.5.9"
        run: bash native/inject-native.sh
      - name: Verify native engine libs (before the long Gradle build)
        run: |
          J=android/app/src/main/jniLibs
          for abi in arm64-v8a armeabi-v7a; do
            for so in libsherpa-onnx-jni.so libonnxruntime.so libpiper_phonemize_core.so libpiperphon_jni.so; do
              test -s "$J/$abi/$so" || { echo "::error::$abi/$so در jniLibs نیست"; exit 1; }
            done
            strings "$J/$abi/libsherpa-onnx-jni.so" | grep -q phonemeCodepoints || { echo "::error::libsherpa-onnx-jni.so ($abi) نام phonemeCodepoints را ندارد؛ نسخهٔ sherpa با پلاگین نمی‌خواند"; exit 1; }
            strings "$J/$abi/libpiperphon_jni.so" | grep -q Java_com_pdfvoice_phon_Phonemizer_nativePhonemize || { echo "::error::نمادهای JNI آوانگار در $abi نیست"; exit 1; }
          done
          test -s android/app/src/main/java/com/pdfvoice/phon/Phonemizer.java
          if [ -s android/app/src/main/assets/phonemizer/espeak-ng-data/phondata ]; then echo "espeak-ng-data هم‌نسخه داخل assets است"; else echo "::warning::espeak-ng-data هم‌نسخه ساخته نشد؛ دادهٔ espeak از اولین صدای نصب‌شده کپی می‌شود"; fi
          grep -n "__SHERPA_VER__" android/app/src/main/java -r && { echo "::error::برچسب نسخه در پلاگین جایگزین نشد"; exit 1; } || true
      - name: Add neural denoise model (DPDFNet)
        run: bash native/add-denoise-model.sh
      - name: Add Mana custom phonemizer (ezafe model)
        run: bash native/build-mana-phon.sh
      - name: Apply app icon
        run: bash native/apply-icon.sh
      - name: Check native back handler (BackApp)
        run: |
          find android/app/src/main/java -name BackApp.java | grep -q . || echo "::warning::BackApp.java ساخته نشد"
          grep -q 'android:name="\.BackApp"' android/app/src/main/AndroidManifest.xml && echo "BackApp registered" || echo "::warning::BackApp در مانیفست ثبت نشد؛ کشیدن از لبه برنامه را به خانهٔ گوشی می‌برد"
      - name: Show checksums to pin
        if: always()
        run: sort -u ~/.offline-cache/sums-seen.txt 2>/dev/null || true
      - name: Sync
        run: npx cap sync android
      - name: Verify OCR files copied into Android assets
        run: |
          ls -la www/ocr/ort www/ocr/paddle
          ls -la android/app/src/main/assets/public/ocr/ort android/app/src/main/assets/public/ocr/paddle
          ls www/ocr/ort/ort-wasm-simd-threaded.wasm >/dev/null 2>&1 || echo "::warning::ort-wasm-simd-threaded.wasm در www/ocr/ort نیست؛ OCR چندنخی فعال نمی‌شود (fetch-offline.sh باید آن را از onnxruntime-web 1.17.3 بگیرد)"
      - name: Patch Gradle repos
        run: |
          sed -i "s#^\([[:space:]]*\)google()#\1google()\n\1maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }#" android/build.gradle
          grep -n "google()\|mavenCentral\|storage-download\|google-services" android/build.gradle || true
      - name: Check Maven access
        continue-on-error: true
        run: |
          P=org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.0/kotlin-stdlib-jdk8-1.9.0.pom
          for U in https://repo.maven.apache.org/maven2 https://maven-central.storage-download.googleapis.com/maven2 https://repo1.maven.org/maven2; do
            echo "$U -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 $U/$P)"
          done
      - name: Build debug APK
        run: |
          cd android && chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon --stacktrace --refresh-dependencies 2>&1 | tee ../build.log
            [ "${PIPESTATUS[0]}" -eq 0 ] && exit 0
            grep -n -A8 "What went wrong\|error:" ../build.log | head -60 | tee -a "$GITHUB_STEP_SUMMARY"
            grep -q "error:\|cannot find symbol\|does not exist\|files found" ../build.log && break
            sleep 15
          done
          exit 1
      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PdfVoiceReader.apk
      - name: Verify native engine inside the APK
        run: |
          unzip -l PdfVoiceReader.apk | grep -q "assets/denoise/dpdfnet_baseline.onnx" && echo "denoise model داخل APK است" || echo "::warning::مدل حذف‌نویز عصبی داخل APK نیست؛ فقط فیلتر کلاسیک اجرا می‌شود"
          for abi in arm64-v8a armeabi-v7a; do
            for so in libsherpa-onnx-jni.so libonnxruntime.so libpiper_phonemize_core.so libpiperphon_jni.so; do
              unzip -l PdfVoiceReader.apk | grep -q "lib/$abi/$so" || { echo "::error::$abi/$so داخل APK نیست"; exit 1; }
            done
          done
          unzip -l PdfVoiceReader.apk | grep -q "assets/phonemizer/espeak-ng-data/phondata" && echo "espeak-ng-data هم‌نسخه داخل APK است" || echo "::warning::espeak-ng-data هم‌نسخه داخل APK نیست"
          for f in model_quantized.onnx tokenizer.json VERSION; do
            unzip -l PdfVoiceReader.apk | grep -q "assets/mana/ezafe/$f" || { echo "::error::assets/mana/ezafe/$f داخل APK نیست"; exit 1; }
          done
      - name: Verify OCR files inside the APK
        run: |
          unzip -l PdfVoiceReader.apk | grep -E "assets/public/ocr/" || true
          unzip -l PdfVoiceReader.apk | grep -q "assets/public/fa_lexicon.js" || echo "::warning::fa_lexicon.js داخل APK نیست؛ واژه‌نامهٔ املایی غیرفعال می‌ماند"
          unzip -l PdfVoiceReader.apk | grep -q "assets/public/ocr/ort/ort-wasm-simd-threaded.wasm" || echo "::warning::ort-wasm-simd-threaded.wasm داخل APK نیست؛ OCR چندنخی کار نمی‌کند"
          if [ -s ocr-int8/arabic_PP-OCRv5_mobile_rec_int8.onnx ]; then
            unzip -l PdfVoiceReader.apk | grep -q "assets/public/ocr/paddle/arabic_PP-OCRv5_mobile_rec_int8.onnx" || echo "::warning::مدل int8 در مخزن هست ولی داخل APK نیست"
          fi
          if [ -s fonts/fonts-extra.css ]; then
            want=$(grep -o 'extra/[^"]*\.woff2' fonts/fonts-extra.css | sort -u | wc -l)
            have=$(unzip -l PdfVoiceReader.apk | grep -c "assets/public/fonts/extra/.*\.woff2" || true)
            unzip -l PdfVoiceReader.apk | grep -q "assets/public/fonts/fonts-extra.css" || echo "::warning::fonts-extra.css داخل APK نیست؛ قلم‌های بومی بیشتر غیرفعال می‌مانند"
            [ "$have" -ge "$want" ] || echo "::warning::فایل قلم داخل APK کم است ($have از $want)"
          fi
          for f in ort/ort.min.js ort/ort-wasm-simd.wasm paddle/PP-OCRv5_mobile_det.onnx paddle/arabic_PP-OCRv5_mobile_rec.onnx paddle/arabic_PP-OCRv5_mobile_rec_dict.txt; do
            unzip -l PdfVoiceReader.apk | grep -q "assets/public/ocr/$f" || { echo "OCR file missing from APK: $f"; exit 1; }
          done
      - name: Diagnose native ORT libs (گزارش F-11؛ بیلد را نمی‌شکند)
        continue-on-error: true
        run: |
          sym() { readelf -Ws --dyn-syms "$1" 2>/dev/null | grep OrtGetApiBase | head -2 | sed 's/^ */    /' || true; }
          need() { readelf -d "$1" 2>/dev/null | grep -E 'SONAME|NEEDED' | sed 's/^ */    /' || true; }
          ver() { strings "$1" | grep -E '^1\.[0-9]+\.[0-9]+$' | sort -V | tail -1; }
          {
            echo "### ORT بومی: کدام libonnxruntime.so داخل APK مانده؟"
            echo '```'
            unzip -lv PdfVoiceReader.apk | grep -E 'lib/(arm64-v8a|armeabi-v7a)/lib(onnxruntime|sherpa|piper)' || true
            rm -rf /tmp/apkso /tmp/aar && mkdir -p /tmp/apkso /tmp/aar
            unzip -o -q PdfVoiceReader.apk 'lib/arm64-v8a/*.so' -d /tmp/apkso || true
            APK_ORT=/tmp/apkso/lib/arm64-v8a/libonnxruntime.so
            SH_ORT=android/app/src/main/jniLibs/arm64-v8a/libonnxruntime.so
            AAR=$(find "$HOME/.gradle" -name 'onnxruntime-android-*.aar' 2>/dev/null | head -1)
            echo "AAR: ${AAR:-NOT FOUND}"
            [ -n "$AAR" ] && unzip -o -q "$AAR" 'jni/arm64-v8a/*' -d /tmp/aar || true
            for f in "$SH_ORT" /tmp/aar/jni/arm64-v8a/libonnxruntime.so "$APK_ORT"; do
              [ -f "$f" ] || { echo "== $f : MISSING"; continue; }
              echo "== $f : $(stat -c %s "$f") bytes · sha256 $(sha256sum "$f" | cut -c1-16) · ver $(ver "$f")"
              echo "  OrtGetApiBase:"; sym "$f"; [ -n "$(sym "$f")" ] || echo "    NOT FOUND"
              echo "  elf:"; need "$f"
            done
            echo "== (نتیجه) نسخهٔ مانده در APK = $( [ -f "$APK_ORT" ] && { cmp -s "$APK_ORT" "$SH_ORT" && echo 'sherpa' || { cmp -s "$APK_ORT" /tmp/aar/jni/arm64-v8a/libonnxruntime.so && echo 'AAR' || echo 'نامشخص'; }; } )"
            for j in /tmp/aar/jni/arm64-v8a/libonnxruntime4j_jni.so /tmp/apkso/lib/arm64-v8a/libonnxruntime4j_jni.so /tmp/apkso/lib/arm64-v8a/libsherpa-onnx-jni.so; do
              [ -f "$j" ] || { echo "== $j : MISSING"; continue; }
              echo "== $j"; echo "  OrtGetApiBase:"; sym "$j"; echo "  elf:"; need "$j"
            done
            echo "--- gradle (app):"
            grep -n "onnxruntime\|pickFirst\|packagingOptions\|useLegacyPackaging" android/app/build.gradle || echo "(none)"
            echo '```'
          } 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload APK (run page)
        uses: actions/upload-artifact@v4
        with:
          name: PdfVoiceReader-apk
          path: PdfVoiceReader.apk
      - name: Publish release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: PdfVoiceReader.apk

name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web files
        run: mkdir -p www && cp index.html www/index.html
      - name: Install dependencies
        run: npm install --legacy-peer-deps
      - name: Bundle Piper (optional)
        continue-on-error: true
        run: |
          npm install --no-save --legacy-peer-deps @diffusionstudio/vits-web esbuild
          echo "import * as tts from '@diffusionstudio/vits-web'; window.PiperTTS = tts;" > piper-entry.js
          npx esbuild piper-entry.js --bundle --format=iife --minify --platform=browser --external:fs --external:path --external:os --external:worker_threads --external:perf_hooks --outfile=www/piper.js
      - name: Bundle OCR engine and fa/en data (offline)
        continue-on-error: true
        run: |
          O="$GITHUB_WORKSPACE/www/ocr"; mkdir -p "$O/lang" /tmp/ocr && cd /tmp/ocr
          npm init -y >/dev/null && npm i tesseract.js@5.1.1 --silent
          cp node_modules/tesseract.js/dist/tesseract.min.js node_modules/tesseract.js/dist/worker.min.js "$O/"
          find node_modules/tesseract.js-core -maxdepth 1 -name 'tesseract-core*' -type f -exec cp {} "$O/" \;
          for L in fas eng; do
            curl -fL --retry 3 -o $L.traineddata "https://raw.githubusercontent.com/tesseract-ocr/tessdata_best/main/$L.traineddata"
            gzip -9 -n -c $L.traineddata > "$O/lang/$L.traineddata.gz"
          done
          ls -la "$O" "$O/lang"
      - name: Bundle pdf.js (offline)
        continue-on-error: true
        run: |
          mkdir -p "$GITHUB_WORKSPACE/www/lib" /tmp/pdfjs && cd /tmp/pdfjs
          npm init -y >/dev/null && npm i pdfjs-dist@3.11.174 --silent
          cp node_modules/pdfjs-dist/build/pdf.min.js node_modules/pdfjs-dist/build/pdf.worker.min.js "$GITHUB_WORKSPACE/www/lib/"
          ls -la "$GITHUB_WORKSPACE/www/lib"
      - name: Add Android platform
        run: npx cap add android
      - name: Allow TTS service queries
        run: |
          sed -i 's#<application#<queries><intent><action android:name="android.intent.action.TTS_SERVICE" /></intent></queries>\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Inject native Piper
        run: bash native/inject-native.sh
      - name: Sync
        run: npx cap sync android
      - name: Patch Gradle repos
        run: |
          sed -i "s#^\([[:space:]]*\)google()#\1google()\n\1maven { url 'https://maven-central.storage-download.googleapis.com/maven2/' }#" android/build.gradle
          grep -n "google()\|mavenCentral\|storage-download\|google-services" android/build.gradle || true
      - name: Check Maven access
        continue-on-error: true
        run: |
          P=org/jetbrains/kotlin/kotlin-stdlib-jdk8/1.9.0/kotlin-stdlib-jdk8-1.9.0.pom
          for U in https://repo.maven.apache.org/maven2 https://maven-central.storage-download.googleapis.com/maven2 https://repo1.maven.org/maven2; do
            echo "$U -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 30 $U/$P)"
          done
      - name: Build debug APK
        run: |
          cd android && chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew assembleDebug --no-daemon --stacktrace --refresh-dependencies && exit 0
            sleep 15
          done
          exit 1
      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk PdfVoiceReader.apk
      - name: Upload APK (run page)
        uses: actions/upload-artifact@v4
        with:
          name: PdfVoiceReader-apk
          path: PdfVoiceReader.apk
      - name: Publish release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          files: PdfVoiceReader.apk
